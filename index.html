<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lolla Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ebade6;
      font-family: 'Arial Black', Arial, sans-serif;
      padding: 24px;
    }

    .logo-header {
      text-align: center;
      margin-bottom: 16px;
      width: 100vw;
      margin-left: -24px;
      box-sizing: border-box;
      padding: 0 24px;
    }

    .logo-header img {
      max-width: 480px;
      width: 100%;
      height: auto;
    }

    .schedule-wrapper {
      width: fit-content;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
    }

    /* ── Time column (outside the border) ── */
    .time-column {
      width: 56px;
      flex-shrink: 0;
      position: relative;
    }

    .time-gutter {
      position: relative;
      height: 900px;
    }

    .time-label {
      position: absolute;
      left: 7px;
      color: #000000;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      transform: translateY(-50%);
      white-space: nowrap;
    }

    /* ── Bordered grid (header + body columns only) ── */
    .schedule-grid {
      flex: 0 0 auto;
      border: 1px solid #2194ad;
      border-left-color: #ebade6;
      border-bottom-color: #ebade6;
      overflow: hidden;
    }
    body.wed-hidden .schedule-grid {
      border-left-color: #2194ad;
    }

    .schedule-header,
    .schedule-body {
      display: grid;
      grid-template-columns: repeat(5, 150px 128px);
    }
    /* ── Header ── */
    .day-header {
      grid-column: span 2;
      background-color: #0aafa7;
      color: #000000;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 0.07em;
      text-align: center;
      padding: 10px 6px;
      border-left: 1px solid #2194ad;
      border-bottom: 1px solid #2194ad;
    }

    /* ── Body columns ── */
    .act-column {
      position: relative;
      height: 900px;
      background-color: #32c6e0;
      border-left: 1px solid #2194ad;
      border-bottom: 1px solid #2194ad;
    }

    .act-column:first-child { border-left: none; }
    body.wed-hidden #day-0-acts { border-left: none; }

    #day-5-acts,
    #day-5-stages {
      background-color: #ebade6;
      border-bottom: none;
    }
    #day-5-stages {
      border-left-color: #ebade6;
    }
    #day-5-acts .hour-line,
    #day-5-stages .hour-line {
      display: none;
    }

    .schedule-header .day-header:first-child { border-left: 1px solid #2194ad; }
    body.wed-hidden .schedule-header .day-header:nth-child(2) { border-left: none; }

    .stage-column {
      position: relative;
      height: 900px;
      background-color: #32c6e0;
      border-left: 1px solid #2194ad;
      border-bottom: 1px solid #2194ad;
    }

    /* ── After row (standalone below grid) ── */
    .after-row-grid {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 150px 128px);
      overflow: hidden;
    }

    .after-act-cell,
    .after-stage-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 6px;
      gap: 2px;
    }

    .after-act-cell   { background-color: #a2daeb; }
    .after-stage-cell { background-color: #50ab9a; position: relative; }

    .after-stage-cell.right-edge::after {
      content: '';
      position: absolute;
      right: -1px;
      top: -1px;
      height: calc(100% + 2px);
      width: 1px;
      background-color: #2194ad;
    }

    .after-cell-item {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.1;
    }

    .hour-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background-color: #2194ad;
      pointer-events: none;
    }

    /* ── Wednesday column visibility ── */
    body.wed-hidden .schedule-header,
    body.wed-hidden .schedule-body,
    body.wed-hidden .after-row-grid {
      grid-template-columns: repeat(4, 150px 120px);
    }

    body.wed-hidden #day-5-acts,
    body.wed-hidden #day-5-stages,
    body.wed-hidden .schedule-header .day-header:first-child,
    body.wed-hidden #after-act-5,
    body.wed-hidden #after-stage-5 {
      display: none;
    }

    /* ── Act blocks ── */
    .act-block {
      position: absolute;
      left: 0;
      right: 0;
      padding: 4px 6px;
      overflow: hidden;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 0.25px solid #2194ad;
      border-top: none;
    }

    .act-name {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      line-height: 1.05;
      word-break: break-word;
    }

    .act-time {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-size: 14px;
      font-weight: 700;
      margin-top: 0;
      letter-spacing: 0.01em;
    }

    /* ── Stage blocks ── */
    .stage-block {
      position: absolute;
      left: 0;
      right: 0;
      padding: 4px 5px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.25px solid #2194ad;
      border-top: none;
    }

    .stage-name {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.1;
      word-break: break-word;
    }

    /* ── Editor section ── */
    #editor-section {
      max-width: 1176px;
      margin: 32px auto 0;
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
    }

    #editor-section h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #000;
    }

    #acts-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 14px;
    }

    #acts-table thead tr {
      background-color: #0aafa7;
    }

    #acts-table th {
      padding: 8px 10px;
      text-align: left;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid #2194ad;
    }

    #acts-table td {
      padding: 6px 10px;
      border: 1px solid #2194ad;
      vertical-align: middle;
    }

    /* Column widths and alignment */
    #acts-table { table-layout: fixed; }
    #acts-table th:nth-child(1), #acts-table td:nth-child(1) { width: 80px;  text-align: center; }
    #acts-table th:nth-child(2), #acts-table td:nth-child(2) { width: 50px;  text-align: center; }
    #acts-table th:nth-child(3), #acts-table td:nth-child(3) { width: 150px; }
    #acts-table th:nth-child(4), #acts-table td:nth-child(4) { width: 110px; }
    #acts-table th:nth-child(5), #acts-table td:nth-child(5) { width: 48px;  text-align: center; }
    #acts-table th:nth-child(6), #acts-table td:nth-child(6) { width: 48px;  text-align: center; }
    #acts-table th:nth-child(7), #acts-table td:nth-child(7) { width: 110px; text-align: center; white-space: nowrap; }

    #acts-table tbody tr:nth-child(odd)  { background-color: #32c6e0; }
    #acts-table tbody tr:nth-child(even) { background-color: #5dd2e8; }

    #acts-table tbody tr.editing-row {
      outline: 2px solid #000;
      outline-offset: -2px;
    }

    .btn {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background-color: #0aafa7;
      color: #000;
      border: 1px solid #2194ad;
      padding: 3px 8px;
      cursor: pointer;
    }

    .btn:hover { background-color: #08948d; }

    .btn-delete {
      background-color: #000;
      color: #fff;
      border-color: #000;
    }

    .btn-delete:hover { background-color: #333; }

    .btn-reset {
      background-color: #ebade6;
      border-color: #2194ad;
      margin-left: 12px;
      font-size: 11px;
    }

    .btn-reset:hover { background-color: #d98fd3; }

    .combobox-wrapper {
      position: relative;
      display: inline-block;
    }

    .combobox-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 200;
      background: #fff;
      border: 1px solid #2194ad;
      min-width: 180px;
      max-height: 220px;
      overflow-y: auto;
    }

    .combobox-dropdown.open { display: block; }

    .combobox-option {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 5px 8px;
      cursor: pointer;
      color: #000;
    }

    .combobox-option:hover { background-color: #32c6e0; }

    #add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background-color: #0aafa7;
      border: 1px solid #2194ad;
      padding: 10px 12px;
    }

    #add-form select,
    #add-form input {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 4px 7px;
      border: 1px solid #2194ad;
      background-color: #fff;
      color: #000;
    }

    #add-act-name { width: 180px; }
    #add-stage-input { width: 120px; }
    #add-form input[name="start"],
    #add-form input[name="end"]   { width: 80px; }

    #form-submit-btn {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background-color: #ccde06;
      color: #000;
      border: 1px solid #2194ad;
      padding: 4px 14px;
      cursor: pointer;
    }

    #form-submit-btn:hover { background-color: #b8c900; }

    /* ── Stage count table ── */
    #stage-count-table {
      border-collapse: collapse;
      font-size: 14px;
      table-layout: fixed;
    }

    #stage-count-table td {
      padding: 6px 10px;
      border: 1px solid #2194ad;
      vertical-align: middle;
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-weight: 700;
    }

    #stage-count-table td:nth-child(1) { width: 160px; }
    #stage-count-table td:nth-child(2) { width: 48px; text-align: center; }

    #stage-count-table tbody tr:nth-child(odd)  { background-color: #32c6e0; }
    #stage-count-table tbody tr:nth-child(even) { background-color: #5dd2e8; }

    /* ── Inline edit inputs inside table rows ── */
    #acts-table td input,
    #acts-table td select {
      font-family: 'Barlow Condensed', 'Arial Black', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 5px;
      border: 1px solid #2194ad;
      background-color: #fff;
      color: #000;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="logo-header">
  <img src="Lolla.png" alt="Logo">
</div>

<div class="schedule-wrapper">

  <!-- Time labels on the left -->
  <div class="time-column">
    <div class="time-gutter" id="time-gutter-left"></div>
  </div>

  <!-- Bordered grid: header + 12 body columns -->
  <div class="schedule-grid">

    <div class="schedule-header">
      <div class="day-header">WED 7/29</div>
      <div class="day-header">THU 7/30</div>
      <div class="day-header">FRI 7/31</div>
      <div class="day-header">SAT 8/01</div>
      <div class="day-header">SUN 8/02</div>
    </div>

    <div class="schedule-body">
      <div class="act-column"   id="day-5-acts"></div>
      <div class="stage-column" id="day-5-stages"></div>

      <div class="act-column"   id="day-0-acts"></div>
      <div class="stage-column" id="day-0-stages"></div>

      <div class="act-column"   id="day-1-acts"></div>
      <div class="stage-column" id="day-1-stages"></div>

      <div class="act-column"   id="day-2-acts"></div>
      <div class="stage-column" id="day-2-stages"></div>

      <div class="act-column"   id="day-3-acts"></div>
      <div class="stage-column" id="day-3-stages"></div>
    </div>

  </div>

  <!-- Time labels sit outside the bordered grid, on the right -->
  <div class="time-column">
    <div class="time-gutter" id="time-gutter"></div>
  </div>

</div>

<!-- ── After-party row (separate, below grid) ── -->
<div class="schedule-wrapper" id="after-section" style="margin-top: 8px;">
  <div style="width:57px; flex-shrink:0;"></div>
  <div class="after-row-grid" id="after-row-grid">
    <div class="after-act-cell"   id="after-act-5"></div>
    <div class="after-stage-cell" id="after-stage-5"></div>
    <div class="after-act-cell"   id="after-act-0"></div>
    <div class="after-stage-cell" id="after-stage-0"></div>
    <div class="after-act-cell"   id="after-act-1"></div>
    <div class="after-stage-cell" id="after-stage-1"></div>
    <div class="after-act-cell"   id="after-act-2"></div>
    <div class="after-stage-cell" id="after-stage-2"></div>
    <div class="after-act-cell"   id="after-act-3"></div>
    <div class="after-stage-cell" id="after-stage-3"></div>
  </div>
  <div style="width:57px; flex-shrink:0;"></div>
</div>

<!-- ── Add Act form ── -->
<div id="editor-section" style="max-width:1176px; margin: 24px auto 0; font-family: 'Barlow Condensed', 'Arial Black', sans-serif; width: fit-content;">
  <h2 style="font-size:22px; font-weight:800; letter-spacing:0.07em; text-transform:uppercase; margin-bottom:12px; color:#000;">Add Act</h2>
  <div id="add-form">
    <select name="day" id="add-day-select">
      <option value="5">Wednesday</option>
      <option value="0" selected>Thursday</option>
      <option value="1">Friday</option>
      <option value="2">Saturday</option>
      <option value="3">Sunday</option>
    </select>
    <label style="font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; display:flex; align-items:center; gap:4px; cursor:pointer;">
      <input type="checkbox" id="add-after-check"> After
    </label>
    <div class="combobox-wrapper">
      <input name="name" type="text" placeholder="Act name" autocomplete="off" id="add-act-name">
      <div id="act-name-dropdown" class="combobox-dropdown"></div>
    </div>
    <div class="combobox-wrapper">
      <input name="stage" type="text" placeholder="Stage" autocomplete="off" id="add-stage-input">
      <div id="stage-dropdown" class="combobox-dropdown"></div>
    </div>
    <input name="start" id="add-start" type="text" placeholder="4:30" autocomplete="off">
    <input name="end"   id="add-end"   type="text" placeholder="5:30 (optional)" autocomplete="off">
    <button id="form-submit-btn">Add Act</button>
  </div>
</div>

<!-- ── Act table (below schedule) ── -->
<div id="acts-table-section" style="max-width:800px; margin:32px auto 0; font-family:'Barlow Condensed','Arial Black',sans-serif; position:relative;">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
    <h2 style="font-size:22px; font-weight:800; letter-spacing:0.07em; text-transform:uppercase; color:#000; margin:0;">Edit Schedule</h2>
    <button class="btn btn-reset" id="reset-btn">Reset to defaults</button>
  </div>
  <table id="acts-table">
    <thead>
      <tr>
        <th>Day</th>
        <th>After</th>
        <th>Act Name</th>
        <th>Stage</th>
        <th>Start</th>
        <th>End</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="acts-tbody"></tbody>
  </table>
  <div id="stage-count-section" style="position:absolute; left:100%; top:0; padding-left:24px; white-space:nowrap;">
    <h2 style="font-size:22px; font-weight:800; letter-spacing:0.07em; text-transform:uppercase; margin-bottom:12px; color:#000;">Stages</h2>
    <table id="stage-count-table">
      <tbody id="stage-count-tbody"></tbody>
    </table>
  </div>
</div>

  const STORAGE_KEY = 'lolla-acts';

  const DEFAULT_ACTS = [];

  function loadActs() {
    const stored = localStorage.getItem(STORAGE_KEY);
    return stored ? JSON.parse(stored) : DEFAULT_ACTS.map(a => Object.assign({}, a));
  }

  function saveActs() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(acts));
  }

  let acts = loadActs();

  function updateActNameDropdown(filterText) {
    const selectedDay = parseInt(document.getElementById('add-day-select').value);
    const isAfter = document.getElementById('add-after-check').checked;
    const alreadyAdded = new Set(
      acts
        .filter(a => a.day === selectedDay && a.after === isAfter)
        .map(a => a.name)
    );
    const matches = ACTS_MASTER_LIST
      .filter(entry => {
        if (entry.day !== selectedDay || entry.after !== isAfter) { return false; }
        if (alreadyAdded.has(entry.name)) { return false; }
        if (!filterText) { return true; }
        return entry.name.toLowerCase().includes(filterText.toLowerCase());
      })
      .sort((a, b) => a.name.localeCompare(b.name));
    const dropdown = document.getElementById('act-name-dropdown');
    dropdown.innerHTML = matches.map(entry => `<div class="combobox-option">${entry.name}</div>`).join('');
    dropdown.classList.toggle('open', matches.length > 0);
  }

  function updateStageDropdown(filterText) {
    const isAfter = document.getElementById('add-after-check').checked;
    let options;
    if (isAfter) {
      const selectedDay = parseInt(document.getElementById('add-day-select').value);
      const venues = [...new Set(
        ACTS_MASTER_LIST
          .filter(entry => entry.day === selectedDay && entry.after === true)
          .map(entry => entry.stage)
      )].sort();
      options = filterText ? venues.filter(v => v.toLowerCase().includes(filterText.toLowerCase())) : venues;
    } else {
      options = filterText ? MAIN_STAGES.filter(s => s.toLowerCase().includes(filterText.toLowerCase())) : MAIN_STAGES;
    }
    const dropdown = document.getElementById('stage-dropdown');
    dropdown.innerHTML = options.map(s => `<div class="combobox-option">${s}</div>`).join('');
    dropdown.classList.toggle('open', options.length > 0);
  }

  // ─────────────────────────────────────────────
  //  Helpers
  // ─────────────────────────────────────────────
  function parseTimeToMinutes(timeString) {
    const withPeriod = timeString.match(/^(\d+):(\d+)\s*(AM|PM)$/i);
    if (withPeriod) {
      let hours = parseInt(withPeriod[1]);
      const minutes = parseInt(withPeriod[2]);
      const period = withPeriod[3].toUpperCase();
      if (period === 'PM' && hours !== 12) { hours += 12; }
      if (period === 'AM' && hours === 12) { hours = 0; }
      return hours * 60 + minutes;
    }
    let [hours, minutes] = timeString.split(':').map(Number);
    // No suffix — assume PM for hours 1–11 (schedule is all afternoon/evening)
    if (hours < 12) { hours += 12; }
    return hours * 60 + minutes;
  }

  function timeToPixels(timeString) {
    return (parseTimeToMinutes(timeString) - START_HOUR * 60) * PX_PER_MIN;
  }

  function timeToMinutes(timeString) {
    return parseTimeToMinutes(timeString);
  }

  function fontSizesForDuration(durationMinutes) {
    if (durationMinutes >= 60) return { name: 22, time: 14 };
    if (durationMinutes >= 40) return { name: 20, time: 13 };
    return { name: 17, time: 12 };
  }

  function formatDisplayTime(timeString) {
    const totalMinutes = parseTimeToMinutes(timeString);
    const hours24 = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    const displayHour = hours24 > 12 ? hours24 - 12 : (hours24 === 0 ? 12 : hours24);
    const displayMinutes = `:${String(minutes).padStart(2, '0')}`;
    return `${displayHour}${displayMinutes}`;
  }

  // ─────────────────────────────────────────────
  //  Render hour grid lines and time labels
  //  The time-column is offset by the header height so labels
  //  align with the body grid lines.
  // ─────────────────────────────────────────────
  function renderTimeGrid() {
    const timeGutterRight = document.getElementById('time-gutter');
    const timeGutterLeft  = document.getElementById('time-gutter-left');
    const scheduleHeader  = document.querySelector('.schedule-header');
    const allColumns      = document.querySelectorAll('.act-column, .stage-column');

    const headerHeight = scheduleHeader.offsetHeight;
    timeGutterRight.style.marginTop = headerHeight + 'px';
    timeGutterLeft.style.marginTop  = headerHeight + 'px';

    for (let hour = START_HOUR; hour <= END_HOUR; hour++) {
      const topPx = timeToPixels(`${hour}:00`);

      let labelText;
      if (hour === 12)      { labelText = '12 PM'; }
      else if (hour === 22) { labelText = '10:00'; }
      else                  { labelText = `${hour - 12}:00`; }

      for (const gutter of [timeGutterLeft, timeGutterRight]) {
        const label = document.createElement('div');
        label.className   = 'time-label';
        label.style.top   = topPx + 'px';
        label.textContent = labelText;
        gutter.appendChild(label);
      }

      if (hour !== START_HOUR) {
        allColumns.forEach(column => {
          const line = document.createElement('div');
          line.className = 'hour-line';
          line.style.top = topPx + 'px';
          column.appendChild(line);
        });
      }
    }
  }

  // ─────────────────────────────────────────────
  //  Render act + stage blocks from ACTS array
  // ─────────────────────────────────────────────
  function updateWednesdayVisibility() {
    const hasWedAfterActs = acts.some(a => a.after && a.day === 5);
    document.body.classList.toggle('wed-hidden', !hasWedAfterActs);
  }

  function renderAfterFooter() {
    const dayOrder      = [5, 0, 1, 2, 3];
    const filledDays    = dayOrder.filter(day => acts.some(a => a.after && a.day === day));
    const lastFilledDay = filledDays[filledDays.length - 1];

    for (let dayIdx = 0; dayIdx < dayOrder.length; dayIdx++) {
      const day       = dayOrder[dayIdx];
      const actCell   = document.getElementById(`after-act-${day}`);
      const stageCell = document.getElementById(`after-stage-${day}`);
      actCell.innerHTML   = '';
      stageCell.innerHTML = '';

      const dayAfterActs = acts.filter(a => a.after && a.day === day);

      if (dayAfterActs.length === 0) {
        actCell.style.backgroundColor   = 'transparent';
        actCell.style.borderLeft        = 'none';
        actCell.style.borderTop         = '';
        actCell.style.borderBottom      = '';
        stageCell.style.backgroundColor = 'transparent';
        stageCell.style.borderLeft      = 'none';
        stageCell.style.borderTop       = '';
        stageCell.style.borderBottom    = '';
        stageCell.classList.remove('right-edge');
      } else {
        const isLast       = (day === lastFilledDay);
        const nextDay      = dayOrder[dayIdx + 1];
        const nextIsFilled = nextDay !== undefined && filledDays.includes(nextDay);

        actCell.style.backgroundColor   = '';
        actCell.style.borderLeft        = '1px solid #2194ad';
        actCell.style.borderTop         = '1px solid #2194ad';
        actCell.style.borderBottom      = '1px solid #2194ad';
        stageCell.style.backgroundColor = '';
        stageCell.style.borderLeft      = '1px solid #2194ad';
        stageCell.style.borderTop       = '1px solid #2194ad';
        stageCell.style.borderBottom    = '1px solid #2194ad';
        stageCell.classList.toggle('right-edge', isLast || !nextIsFilled);

        dayAfterActs.forEach(act => {
          const nameEl = document.createElement('div');
          nameEl.className   = 'after-cell-item';
          nameEl.textContent = act.name;
          actCell.appendChild(nameEl);

          const stageEl = document.createElement('div');
          stageEl.className   = 'after-cell-item';
          stageEl.textContent = act.stage;
          stageCell.appendChild(stageEl);
        });
      }
    }

    // Sunday-as-last edge case: no empty act cell follows, use grid's own border-right
    document.getElementById('after-row-grid').style.borderRight =
      (lastFilledDay === 3 && filledDays.length > 0) ? '1px solid #2194ad' : '';

    const hasAnyAfterActs = acts.some(a => a.after);
    document.getElementById('after-section').style.display = hasAnyAfterActs ? '' : 'none';
    updateWednesdayVisibility();
  }

  function clearActBlocks() {
    document.querySelectorAll('.act-block, .stage-block').forEach(el => el.remove());
  }

  function renderActs() {
    acts.forEach(act => {
      if (act.after || !act.start) { return; }
      const actColumn   = document.getElementById(`day-${act.day}-acts`);
      const stageColumn = document.getElementById(`day-${act.day}-stages`);
      if (!actColumn || !stageColumn) {
        return;
      }

      const topPx          = timeToPixels(act.start);
      const endTime        = act.end || '10:00';
      const heightPx       = timeToPixels(endTime) - topPx;
      const durationMins   = timeToMinutes(endTime) - timeToMinutes(act.start);
      const fontSizes      = fontSizesForDuration(durationMins);

      // Left column: act name + time range
      const actBlock = document.createElement('div');
      actBlock.className = 'act-block';
      actBlock.style.top             = topPx + 'px';
      actBlock.style.height          = heightPx + 'px';
      actBlock.style.backgroundColor = act.actColor     || '#ccde06';
      actBlock.style.color           = act.actTextColor || '#000000';

      const nameEl = document.createElement('div');
      nameEl.className = 'act-name';
      nameEl.style.fontSize = fontSizes.name + 'px';
      nameEl.textContent = act.name;

      const timeEl = document.createElement('div');
      timeEl.className = 'act-time';
      timeEl.style.fontSize = fontSizes.time + 'px';
      timeEl.textContent = act.end
        ? `${formatDisplayTime(act.start)} - ${formatDisplayTime(act.end)}`
        : formatDisplayTime(act.start);

      actBlock.appendChild(nameEl);
      actBlock.appendChild(timeEl);
      actColumn.appendChild(actBlock);

      // Right column: stage name
      const stageBlock = document.createElement('div');
      stageBlock.className = 'stage-block';
      stageBlock.style.top             = topPx + 'px';
      stageBlock.style.height          = heightPx + 'px';
      stageBlock.style.backgroundColor = act.stageColor     || '#000000';
      stageBlock.style.color           = act.stageTextColor || '#ffffff';

      const stageNameEl = document.createElement('div');
      stageNameEl.className = 'stage-name';
      stageNameEl.textContent = act.stage;

      stageBlock.appendChild(stageNameEl);
      stageColumn.appendChild(stageBlock);
    });
  }

  // ─────────────────────────────────────────────
  //  Stage count table
  // ─────────────────────────────────────────────
  const STAGE_ALIAS_MAP = {
    'ALLIANZ': 'ALLIANZ (LAKESHORE)',
    'AIRBNB':  'AIRBNB (GROVE)',
  };

  function renderStageCountTable() {
    const stageCounts = {};
    MAIN_STAGES.forEach(stageName => { stageCounts[stageName] = 0; });
    acts.forEach(act => {
      if (act.after) { return; }
      const canonicalStage = STAGE_ALIAS_MAP[act.stage] || act.stage;
      if (!stageCounts.hasOwnProperty(canonicalStage)) { return; }
      stageCounts[canonicalStage] += 1;
    });
    const tbody = document.getElementById('stage-count-tbody');
    tbody.innerHTML = '';
    MAIN_STAGES.forEach(stageName => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${stageName}</td><td>${stageCounts[stageName]}</td>`;
      tbody.appendChild(row);
    });
  }

  // ─────────────────────────────────────────────
  //  Editor
  // ─────────────────────────────────────────────
  const DAY_LABELS = ['Thursday', 'Friday', 'Saturday', 'Sunday', '', 'Wednesday'];
  let editingIndex = -1;

  function renderTable() {
    const tbody = document.getElementById('acts-tbody');
    tbody.innerHTML = '';

    const dayOrderMap = { 5: 0, 0: 1, 1: 2, 2: 3, 3: 4 };
    const sorted = acts
      .map((act, originalIndex) => ({ act, originalIndex }))
      .sort((a, b) => {
        const dayDiff = (dayOrderMap[a.act.day] ?? 99) - (dayOrderMap[b.act.day] ?? 99);
        if (dayDiff !== 0) return dayDiff;
        if (a.act.after !== b.act.after) return a.act.after ? 1 : -1;
        const minutesA = a.act.after ? Infinity : parseTimeToMinutes(a.act.start || '0:00');
        const minutesB = b.act.after ? Infinity : parseTimeToMinutes(b.act.start || '0:00');
        return minutesA - minutesB;
      });

    sorted.forEach(({ act, originalIndex }) => {
      const row = document.createElement('tr');

      if (originalIndex === editingIndex) {
        row.classList.add('editing-row');
        const isAfterAct = !!act.after;
        row.innerHTML = `
          <td style="text-align:center">${DAY_LABELS[act.day] || ''}</td>
          <td style="text-align:center"><input type="checkbox" id="ie-after-check" onchange="inlineEditAfterChange(this)"></td>
          <td><input name="ie-name" type="text" autocomplete="off"></td>
          <td>
            <input id="ie-stage-input" type="text" autocomplete="off">
          </td>
          <td><input name="ie-start" type="text" autocomplete="off" ${isAfterAct ? 'disabled style="opacity:0.4"' : ''}></td>
          <td><input name="ie-end"   type="text" autocomplete="off" ${isAfterAct ? 'disabled style="opacity:0.4"' : ''}></td>
          <td style="white-space:nowrap">
            <button class="btn" onclick="saveInlineEdit(${originalIndex})">Save</button>
            <button class="btn btn-delete" onclick="cancelInlineEdit()">Cancel</button>
          </td>`;
        row.querySelector('#ie-after-check').checked = isAfterAct;
        row.querySelector('[name=ie-name]').value   = act.name;
        row.querySelector('#ie-stage-input').value  = act.stage || '';
        row.querySelector('[name=ie-start]').value = act.start || '';
        row.querySelector('[name=ie-end]').value   = act.end   || '';
      } else {
        row.innerHTML = `
          <td>${DAY_LABELS[act.day] || ''}</td>
          <td style="text-align:center"><input type="checkbox" disabled ${act.after ? 'checked' : ''}></td>
          <td>${act.name}</td>
          <td>${act.stage}</td>
          <td>${act.start || ''}</td>
          <td>${act.end || ''}</td>
          <td style="white-space:nowrap">
            <button class="btn" onclick="startEdit(${originalIndex})">Edit</button>
            <button class="btn btn-delete" onclick="deleteAct(${originalIndex})">Delete</button>
          </td>`;
      }

      tbody.appendChild(row);
    });
  }

  function startEdit(index) {
    editingIndex = index;
    renderTable();
  }

  function inlineEditAfterChange(checkbox) {
    const row = checkbox.closest('tr');
    const startInput = row.querySelector('[name=ie-start]');
    const endInput   = row.querySelector('[name=ie-end]');
    startInput.value         = '';
    endInput.value           = '';
    startInput.disabled      = checkbox.checked;
    endInput.disabled        = checkbox.checked;
    startInput.style.opacity = checkbox.checked ? '0.4' : '';
    endInput.style.opacity   = checkbox.checked ? '0.4' : '';
  }

  function saveInlineEdit(index) {
    const tbody   = document.getElementById('acts-tbody');
    const day     = acts[index].day;
    const after   = tbody.querySelector('#ie-after-check').checked;
    const name    = tbody.querySelector('[name=ie-name]').value.trim();
    const stage   = tbody.querySelector('#ie-stage-input').value.trim();
    const start = tbody.querySelector('[name=ie-start]').value.trim() || undefined;
    const end   = tbody.querySelector('[name=ie-end]').value.trim()   || undefined;
    if (!name || !stage) { return; }
    acts[index] = { day, after, name, stage, start, end };
    saveActs();
    clearActBlocks();
    renderActs();
    renderAfterFooter();
    editingIndex = -1;
    renderTable();
    renderStageCountTable();
  }

  function cancelInlineEdit() {
    editingIndex = -1;
    renderTable();
  }

  function deleteAct(index) {
    acts.splice(index, 1);
    saveActs();
    clearActBlocks();
    renderActs();
    renderAfterFooter();
    renderTable();
    renderStageCountTable();
  }

  document.getElementById('add-day-select').addEventListener('change', function () {
    const afterCheck = document.getElementById('add-after-check');
    if (this.value === '5') {
      afterCheck.checked = true;
      afterCheck.disabled = true;
      afterCheck.dispatchEvent(new Event('change'));
    } else {
      afterCheck.disabled = false;
    }
  });

  document.getElementById('add-after-check').addEventListener('change', function () {
    document.getElementById('add-stage-input').value = '';
    const startInput = document.getElementById('add-start');
    const endInput   = document.getElementById('add-end');
    startInput.value         = '';
    endInput.value           = '';
    startInput.disabled      = this.checked;
    endInput.disabled        = this.checked;
    startInput.style.opacity = this.checked ? '0.4' : '';
    endInput.style.opacity   = this.checked ? '0.4' : '';
  });

  document.getElementById('add-act-name').addEventListener('focus', function () {
    updateActNameDropdown('');
  });

  document.getElementById('add-act-name').addEventListener('input', function () {
    updateActNameDropdown(this.value);
    const selectedDay = parseInt(document.getElementById('add-day-select').value);
    const isAfter = document.getElementById('add-after-check').checked;
    const match = ACTS_MASTER_LIST.find(
      entry => entry.name === this.value && entry.day === selectedDay && entry.after === isAfter
    );
    if (!match) { return; }
    document.getElementById('add-stage-input').value = match.stage;
    document.getElementById('add-start').value = match.start || '';
    document.getElementById('add-end').value   = match.end   || '';
  });

  document.getElementById('add-stage-input').addEventListener('focus', function () {
    updateStageDropdown('');
  });

  document.getElementById('add-stage-input').addEventListener('input', function () {
    updateStageDropdown(this.value);
  });

  document.getElementById('add-stage-input').addEventListener('blur', function () {
    setTimeout(() => {
      document.getElementById('stage-dropdown').classList.remove('open');
    }, 150);
  });

  document.getElementById('stage-dropdown').addEventListener('click', function (event) {
    const option = event.target.closest('.combobox-option');
    if (!option) { return; }
    document.getElementById('add-stage-input').value = option.textContent;
    this.classList.remove('open');
  });

  document.getElementById('add-act-name').addEventListener('blur', function () {
    setTimeout(() => {
      document.getElementById('act-name-dropdown').classList.remove('open');
    }, 150);
  });

  document.getElementById('act-name-dropdown').addEventListener('click', function (event) {
    const option = event.target.closest('.combobox-option');
    if (!option) { return; }
    const nameInput = document.getElementById('add-act-name');
    nameInput.value = option.textContent;
    nameInput.dispatchEvent(new Event('input'));
    this.classList.remove('open');
  });

  document.getElementById('form-submit-btn').addEventListener('click', () => {
    const form  = document.getElementById('add-form');
    const day   = parseInt(form.querySelector('[name=day]').value);
    const after = document.getElementById('add-after-check').checked;
    const name  = form.querySelector('[name=name]').value.trim();
    const stage = document.getElementById('add-stage-input').value.trim();
    const start = document.getElementById('add-start').value.trim() || undefined;
    const end   = document.getElementById('add-end').value.trim()   || undefined;
    if (!name || !stage) { return; }
    acts.push({ day, after, name, stage, start, end });
    saveActs();
    clearActBlocks();
    renderActs();
    renderAfterFooter();
    renderTable();
    renderStageCountTable();
    form.querySelector('[name=name]').value  = '';
    form.querySelector('[name=start]').value = '';
    form.querySelector('[name=end]').value   = '';
    document.getElementById('add-stage-input').value = '';
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    if (!confirm('Reset all acts to the defaults? This cannot be undone.')) { return; }
    acts = DEFAULT_ACTS.map(a => Object.assign({}, a));
    saveActs();
    clearActBlocks();
    renderActs();
    renderAfterFooter();
    renderTable();
    renderStageCountTable();
  });

  // ─────────────────────────────────────────────
  //  Init
  // ─────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    renderTimeGrid();
    renderActs();
    renderAfterFooter();
    renderTable();
    renderStageCountTable();
    updateWednesdayVisibility();
  });
</script>

</body>
</html>
